# ==============================================================================
# IRIS AI EDUCATIONAL BIOMETRIC ASSESSMENT PLATFORM
# REFERENCE NGINX REVERSE PROXY & HTTPS CONFIGURATION
# ==============================================================================

# Rate limit zone for authentication defense at proxy level
limit_req_zone $binary_remote_addr zone=iris_auth_limit:10m rate=10r/m;

# HTTP -> HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name iris.institution.edu;

    # Certbot challenge validation path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iris.institution.edu;

    # SSL / TLS Modern Ciphers
    ssl_certificate /etc/letsencrypt/live/iris.institution.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iris.institution.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Payload Size Constraints (Supports 10MB Biometric Scans)
    client_max_body_size 15M;

    # Authentication Route Rate Limiting (Defense-in-depth behind proxy)
    location = /api/auth/login {
        limit_req zone=iris_auth_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Streaming Buffering Support
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
