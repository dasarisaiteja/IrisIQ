<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="register.css">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">Customer Registration</h3>

        </div>

        <div class="card-body">

            <!-- Row 1 -->

            <div class="row">

                <div class="col-md-6">

                    <label class="form-label">Customer Code</label>

                    <input
                        type="text"
                        id="employee_code"
                        class="form-control">

                </div>

                <div class="col-md-6">

                    <label class="form-label">Customer Name</label>

                    <input
                        type="text"
                        id="user_name"
                        class="form-control">

                </div>

            </div>

            <!-- Row 2 -->

            <div class="row mt-3">

                <div class="col-md-6">

                    <label class="form-label">Department</label>

                    <input
                        type="text"
                        id="department"
                        class="form-control">

                </div>

                <div class="col-md-6">

                    <label class="form-label">Designation</label>

                    <input
                        type="text"
                        id="designation"
                        class="form-control">

                </div>

            </div>

            <!-- Row 3 -->

            <div class="row mt-3">

                <div class="col-md-6">

                    <label class="form-label">Gender</label>

                    <select
                        id="gender"
                        class="form-control">

                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label">Age</label>

                    <input
                        type="number"
                        id="age"
                        class="form-control">

                </div>

            </div>

            <!-- Row 4 -->

            <div class="row mt-3">

                <div class="col-md-6">

                    <label class="form-label">Date of Birth</label>

                    <input
                        type="date"
                        id="dob"
                        class="form-control">

                </div>

                <div class="col-md-6">

                    <label class="form-label">Blood Group</label>

                    <select
                        id="blood_group"
                        class="form-control">

                        <option value="">Select</option>

                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>

                    </select>

                </div>

            </div>

            <!-- Row 5 -->

            <div class="row mt-3">

                <div class="col-md-6">

                    <label class="form-label">Mobile</label>

                    <input
                        type="text"
                        id="mobile"
                        class="form-control">

                </div>

                <div class="col-md-6">

                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        id="email"
                        class="form-control">

                </div>

            </div>

   <!-- Row 6 -->

<div class="row mt-3">

    <div class="col-md-12">

        <label class="form-label">Address</label>

        <textarea
            id="address"
            class="form-control"
            rows="3"></textarea>

    </div>

</div>

<br>

<!-- ================= CAMERA ================= -->

<div class="text-center">

    <video
        id="video"
        autoplay
        playsinline
        muted
        style="
            width:100%;
            max-width:700px;
            border-radius:15px;
            border:3px solid #0d6efd;
            background:#000;">
    </video>

    <canvas
        id="canvas"
        style="display:none;">
    </canvas>

</div>

<br>

<!-- ================= STATUS ================= -->

<div
    id="status"
    class="fw-bold text-primary text-center mb-2">

    Ready

</div>

<div
    id="counter"
    class="text-center mb-2">

    0 / 40

</div>

<div class="progress mb-3" style="height:28px;">

    <div

        id="progressBar"

        class="progress-bar progress-bar-striped progress-bar-animated bg-success"

        role="progressbar"

        style="width:0%;">

        0%

    </div>

</div>

<button
    id="registerBtn"
    class="btn btn-success btn-lg w-100">

    Register Customer

</button>
    
        </div>

    </div>

</div>

<script src="auth_client.js"></script>
<script src="register.js?v=20260908"></script>

</body>

</html>
