<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Iris AI Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #081120;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.12);
            --primary-accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient floating orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }
        .orb-1 {
            width: 320px;
            height: 320px;
            background: rgba(37, 99, 235, 0.25);
            top: 10%;
            left: 15%;
            animation: floatOrb 10s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 280px;
            height: 280px;
            background: rgba(16, 185, 129, 0.2);
            bottom: 10%;
            right: 15%;
            animation: floatOrb 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.08); }
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
            position: relative;
            z-index: 1;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.35);
            margin-bottom: 16px;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom i.field-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
            transition: color 0.2s ease;
            z-index: 2;
        }

        .form-control-custom {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 13px 44px 13px 44px;
            color: #fff;
            font-size: 15px;
            transition: all 0.25s ease;
        }

        .form-control-custom:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .form-control-custom::placeholder {
            color: #475569;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
            z-index: 2;
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #cbd5e1;
        }

        .btn-submit {
            background: linear-gradient(135deg, #2563eb, #0284c7);
            border: none;
            border-radius: 14px;
            padding: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.4);
            filter: brightness(1.1);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Demo Quick-Fill Section */
        .demo-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .demo-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .demo-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .demo-chip:hover {
            background: rgba(59, 130, 246, 0.18);
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        .demo-chip i {
            display: block;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .demo-chip.admin-chip i { color: #f59e0b; }
        .demo-chip.counselor-chip i { color: #10b981; }
        .demo-chip.student-chip i { color: #38bdf8; }

        .demo-chip span {
            font-size: 11px;
            font-weight: 600;
            display: block;
            color: #e2e8f0;
        }

        /* Alerts */
        .alert-custom {
            border-radius: 12px;
            font-size: 13px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert-custom.alert-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .alert-custom.alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }

        .already-logged-in-box {
            display: none;
            text-align: center;
            padding: 10px 0;
        }

        .user-avatar-badge {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #fff;
            margin-bottom: 16px;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .nav-back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .nav-back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="login-card">
        <a href="index.html" class="nav-back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>

        <div class="brand-header">
            <div class="brand-icon">
                <i class="fa-solid fa-eye"></i>
            </div>
            <h1 class="brand-title">Iris AI Intelligence</h1>
            <p class="brand-subtitle">Biometric Authentication & Assessment Portal</p>
        </div>

        <div id="errorAlert" class="alert-custom alert-danger">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="errorMessage">Invalid credentials.</span>
        </div>

        <div id="successAlert" class="alert-custom alert-success">
            <i class="fa-solid fa-circle-check"></i>
            <span id="successMessage">Login successful! Redirecting...</span>
        </div>

        <!-- Active Session Card (If user is already signed in) -->
        <div id="activeSessionBox" class="already-logged-in-box">
            <div class="user-avatar-badge">
                <i class="fa-solid fa-user-shield" id="activeUserIcon"></i>
            </div>
            <h4 class="fw-bold mb-1" id="activeUserName">Administrator</h4>
            <p class="text-muted fs-6 mb-4" id="activeUserRoleBadge">Signed in as Admin</p>

            <div class="d-grid gap-2">
                <button type="button" class="btn btn-primary btn-lg rounded-3 fw-bold" id="continueBtn" onclick="handleContinue()">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Continue to Dashboard
                </button>
                <button type="button" class="btn btn-outline-danger rounded-3" onclick="handleSignOut()">
                    <i class="fa-solid fa-right-from-bracket me-2"></i> Sign Out / Switch Account
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label" for="usernameInput">
                    <i class="fa-solid fa-user text-primary"></i> Username
                </label>
                <div class="input-group-custom">
                    <i class="fa-solid fa-at field-icon"></i>
                    <input 
                        type="text" 
                        class="form-control-custom" 
                        id="usernameInput" 
                        placeholder="Enter username (e.g. admin)" 
                        required 
                        autocomplete="username"
                    >
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="passwordInput">
                    <i class="fa-solid fa-lock text-primary"></i> Password
                </label>
                <div class="input-group-custom">
                    <i class="fa-solid fa-key field-icon"></i>
                    <input 
                        type="password" 
                        class="form-control-custom" 
                        id="passwordInput" 
                        placeholder="••••••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                    <i class="fa-regular fa-eye toggle-password" id="togglePasswordBtn" title="Show/Hide Password"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText"><i class="fa-solid fa-right-to-bracket"></i> Sign In</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
        </form>

        <!-- Quick Demo Account Fillers -->
        <div class="demo-section" id="demoSection">
            <div class="demo-title">Quick Demo Login (Click to Fill)</div>
            <div class="demo-grid">
                <div class="demo-chip admin-chip" onclick="fillCredentials('admin', 'Admin@IrisIQ2026!')">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Admin</span>
                </div>
                <div class="demo-chip counselor-chip" onclick="fillCredentials('counselor1', 'Counselor@IrisIQ2026!')">
                    <i class="fa-solid fa-user-graduate"></i>
                    <span>Counselor</span>
                </div>
                <div class="demo-chip student-chip" onclick="fillCredentials('student1', 'Student@IrisIQ2026!')">
                    <i class="fa-solid fa-id-card"></i>
                    <span>Student</span>
                </div>
            </div>
        </div>
    </div>

    <script src="auth_client.js?v=20260928_3"></script>
    <script>
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("usernameInput");
        const passwordInput = document.getElementById("passwordInput");
        const submitBtn = document.getElementById("submitBtn");
        const btnText = document.getElementById("btnText");
        const btnSpinner = document.getElementById("btnSpinner");
        const errorAlert = document.getElementById("errorAlert");
        const errorMessage = document.getElementById("errorMessage");
        const successAlert = document.getElementById("successAlert");
        const successMessage = document.getElementById("successMessage");
        const togglePasswordBtn = document.getElementById("togglePasswordBtn");
        const activeSessionBox = document.getElementById("activeSessionBox");
        const demoSection = document.getElementById("demoSection");

        // Toggle password visibility
        togglePasswordBtn.addEventListener("click", () => {
            const isPassword = passwordInput.getAttribute("type") === "password";
            passwordInput.setAttribute("type", isPassword ? "text" : "password");
            togglePasswordBtn.classList.toggle("fa-eye");
            togglePasswordBtn.classList.toggle("fa-eye-slash");
        });

        // Quick fill helper
        window.fillCredentials = function(username, password) {
            usernameInput.value = username;
            passwordInput.value = password;
            hideAlerts();
            usernameInput.focus();
        };

        function hideAlerts() {
            errorAlert.style.display = "none";
            successAlert.style.display = "none";
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorAlert.style.display = "flex";
            successAlert.style.display = "none";
        }

        function showSuccess(msg) {
            successMessage.textContent = msg;
            successAlert.style.display = "flex";
            errorAlert.style.display = "none";
        }

        // Determine destination based on user role or redirect param
        function getRedirectTarget(role) {
            const params = new URLSearchParams(window.location.search);
            const explicitRedirect = params.get("redirect");
            if (explicitRedirect && !explicitRedirect.includes("login.html")) {
                let target = explicitRedirect;
                if (!target.startsWith("/") && !target.startsWith("http")) {
                    target = "/static/" + target;
                }
                return target;
            }

            if (role === "Student") {
                return "/static/student_dashboard.html";
            }
            if (role === "Counselor" || role === "Counsellor") {
                return "/static/counsellor_dashboard.html";
            }
            return "/static/dashboard.html";
        }

        // Check if already authenticated on load
        window.addEventListener("DOMContentLoaded", () => {
            const user = window.IrisAuth ? window.IrisAuth.getUser() : null;
            const token = window.IrisAuth ? window.IrisAuth.getToken() : null;

            if (token && user) {
                // User is already logged in
                loginForm.style.display = "none";
                demoSection.style.display = "none";
                activeSessionBox.style.display = "block";

                document.getElementById("activeUserName").textContent = user.full_name || user.username;
                document.getElementById("activeUserRoleBadge").textContent = `Active Role: ${user.role}`;

                const continueBtn = document.getElementById("continueBtn");
                if (user.role === "Student") {
                    continueBtn.innerHTML = '<i class="fa-solid fa-graduation-cap me-2"></i> Go to Student Profile';
                } else {
                    continueBtn.innerHTML = '<i class="fa-solid fa-gauge-high me-2"></i> Go to Staff Dashboard';
                }
            }
        });

        window.handleContinue = function() {
            const user = window.IrisAuth ? window.IrisAuth.getUser() : null;
            const target = getRedirectTarget(user?.role);
            window.location.href = target;
        };

        window.handleSignOut = function() {
            if (window.IrisAuth) {
                window.IrisAuth.clearAuth();
            }
            window.location.reload();
        };

        // Form submission
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlerts();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError("Please enter both username and password.");
                return;
            }

            // UI loading state
            submitBtn.disabled = true;
            btnText.classList.add("d-none");
            btnSpinner.classList.remove("d-none");

            try {
                const data = await window.IrisAuth.login(username, password);
                showSuccess(`Welcome back, ${data.full_name || data.username}! Redirecting...`);

                const targetUrl = getRedirectTarget(data.role);
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 800);
            } catch (err) {
                showError(err.message || "Invalid username or password.");
                submitBtn.disabled = false;
                btnText.classList.remove("d-none");
                btnSpinner.classList.add("d-none");
            }
        });
    </script>
</body>
</html>
